[package]
name = "hana"
version = "0.3.2"
edition = "2021"
description = "Clean up after Claude Code on Windows: find and kill leftover processes, free ports, and reclaim disk from old sessions and git worktrees. A terminal UI based on jigjoy-ai/seshka."
repository = "https://github.com/cyber1998/hana"
homepage = "https://github.com/cyber1998/hana"
readme = "README.md"
keywords = ["claude-code", "windows", "process", "cleanup", "tui"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"

[[bin]]
name = "hana"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
